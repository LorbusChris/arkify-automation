name: copr-watch

on:
  schedule:
    - cron: "23 */6 * * *"   # kernel builds take 1-3h; 6h granularity is plenty
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    concurrency:
      group: copr-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/copr-watch.sh
