name: rebase

on:
  schedule:
    - cron: "17 6 * * *"   # daily; kernel.org stable releases land at all hours
  workflow_dispatch:
    inputs:
      target:
        description: target to act on
        type: choice
        options: [all, sc7280, surface]
        default: all
      version:
        description: force a version X.Y.Z (skip kernel.org detection)
        required: false
      dry_run:
        description: push rehearsal/* refs only, never the consumption branch
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: credential health check (daily; deploy keys do not expire, but
              they can be revoked - find out today, not on release day)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source config.env
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          if ! git ls-remote "git@github.com:$KERNEL_REPO_SLUG" HEAD >/dev/null 2>&1; then
            title="deploy key for $KERNEL_REPO_SLUG no longer authenticates"
            exists=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
                       --search "in:title \"$title\"" --json number --jq '.[0].number')
            [ -n "$exists" ] || gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "The DEPLOY_KEY secret failed SSH auth against $KERNEL_REPO_SLUG. Re-create the deploy key (repo settings -> Deploy keys, allow write) and update the DEPLOY_KEY secret here. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          echo "deploy key OK"
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TARGET: ${{ inputs.target }}
          FORCE_VERSION: ${{ inputs.version }}
        run: bash scripts/detect.sh

  rebase:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    # one rebase per target at a time; a slow run and the next cron tick must
    # not double-push. Never cancel a running rebase mid-push.
    concurrency:
      group: rebase-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: install build deps (the proven .copr/Makefile set + tooling)
        run: >
          dnf -y install git make gcc flex bison bzip2 dwarves xz rpm-build
          python3-pyyaml rust rust-src bindgen rustfmt curl gh awk
          openssh-clients
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: load config
        run: |
          grep -v '^#' config.env >> "$GITHUB_ENV"
          grep -v '^#' targets/${{ matrix.target }}.env >> "$GITHUB_ENV"
      - name: set up the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
      - name: rebase + arkify + smoke test + ship
        id: run
        env:
          NEW_VERSION: ${{ matrix.version }}
          OLD_VERSION: ${{ matrix.old }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash scripts/rebase-target.sh
      - name: open issue on rebase conflict
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[${{ matrix.target }}] ${{ matrix.version }} rebase needs a human"
          # exact-title match via the list API - the search API's index lags
          exists=$(gh issue list -R "$GITHUB_REPOSITORY" --state open -L 500 --json title |
                   T="$title" python3 -c 'import json,os,sys; print(sum(1 for i in json.load(sys.stdin) if i["title"] == os.environ["T"]))')
          if [ "$exists" = "0" ]; then
            { cat conflict.txt 2>/dev/null || echo "No conflict details captured - see the workflow log."; \
              echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } |
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file -
          fi
      - name: job summary
        if: success()
        run: |
          {
            echo "### ${{ matrix.target }} -> ${{ matrix.version }}"
            echo "- pinned branch: \`linux-${{ matrix.version }}-${{ matrix.target }}-arkify\`"
            if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
              echo "- DRY RUN: rehearsal/* refs pushed, no COPR build triggered"
            else
              echo "- consumption branch \`$CONSUMPTION\` pushed -> COPR builds: https://copr.fedorainfracloud.org/coprs/g/mobility/${{ matrix.target }}/builds/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
